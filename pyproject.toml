[project]
name = "doc-agent"
version = "0.1.0"
description = "Document AI agent demo: extract fields from invoices and contracts, ask questions with verified quotes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.14",
    "pydantic>=2.7",
    "pypdf>=5.0",
    "streamlit>=1.40",
    "reportlab>=4.2",
    "pillow>=10.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: calls the real API (costs a fraction of a cent)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
